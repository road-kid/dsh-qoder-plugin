<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Where dsh-qoder-plugin sits</title>
  <desc id="desc">DeepSeek Harness talks to the dsh-qoder-plugin host provider and web client bundle, which in turn call the Qoder China and Qoder Global endpoints with the saved PAT. Credentials, settings and the catalogue cache stay under the profile's .dsh-qoder-plugin directory.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #57606a; }
      .accentTitle { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #0969da; }
      .label { font: 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #57606a; }
      .note { font: 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #57606a; }
      .flow { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .divider { stroke: #d0d7de; stroke-width: 1; }
      .dashed { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="359" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- DeepSeek Harness -->
  <rect class="box" x="24" y="96" width="208" height="132" rx="10"/>
  <text class="title" x="128" y="128" text-anchor="middle">DeepSeek Harness</text>
  <text class="sub" x="128" y="154" text-anchor="middle">model picker</text>
  <text class="sub" x="128" y="174" text-anchor="middle">conversation loop</text>
  <text class="sub" x="128" y="194" text-anchor="middle">settings slots</text>

  <!-- plugin -->
  <rect x="312" y="76" width="268" height="172" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <text class="accentTitle" x="446" y="108" text-anchor="middle">dsh-qoder-plugin</text>
  <text class="sub" x="446" y="134" text-anchor="middle">host provider</text>
  <text class="sub" x="446" y="152" text-anchor="middle">qoder · qoder-global</text>
  <line class="divider" x1="344" y1="166" x2="548" y2="166"/>
  <text class="sub" x="446" y="190" text-anchor="middle">web client bundle</text>
  <text class="sub" x="446" y="210" text-anchor="middle">cards · composer readout</text>

  <!-- Qoder China -->
  <rect class="box" x="650" y="66" width="240" height="76" rx="10"/>
  <text class="title" x="770" y="96" text-anchor="middle">Qoder China</text>
  <text class="sub" x="770" y="116" text-anchor="middle">qoder.com.cn</text>

  <!-- Qoder Global -->
  <rect class="box" x="650" y="180" width="240" height="76" rx="10"/>
  <text class="title" x="770" y="210" text-anchor="middle">Qoder Global</text>
  <text class="sub" x="770" y="230" text-anchor="middle">qoder.com</text>

  <!-- flows -->
  <path class="flow" d="M 232 162 H 304" marker-end="url(#arrow)"/>
  <text class="label" x="268" y="150" text-anchor="middle">requests</text>
  <text class="label" x="268" y="180" text-anchor="middle">models</text>

  <path class="flow" d="M 580 120 C 602 120, 620 104, 644 104" marker-end="url(#arrow)"/>
  <path class="flow" d="M 580 204 C 602 204, 620 218, 644 218" marker-end="url(#arrow)"/>
  <text class="label" x="614" y="160" text-anchor="middle">PAT</text>

  <!-- local data -->
  <rect class="dashed" x="24" y="272" width="866" height="60" rx="10"/>
  <text class="note" x="457" y="298" text-anchor="middle">Credentials, settings, check-in state and the model-catalogue cache live in &lt;profile&gt;/.dsh-qoder-plugin/</text>
  <text class="note" x="457" y="319" text-anchor="middle">Nothing leaves this machine except calls to Qoder's own endpoints.</text>
</svg>
