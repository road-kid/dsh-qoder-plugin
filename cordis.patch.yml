# Register the Qoder provider without changing the profile's current
# default model. Credentials are Personal Access Tokens (PATs) the user
# pastes into the plugin's card; no OAuth or device flow is started.
#
# The row id is `qoder-plugin`: the browser half keys its `plugins.row.config`
# registration by `<package name>#<row id>`, so this file and the client's
# ROW_ID constant must agree.
- insert:
    - id: qoder-plugin
      name: dsh-qoder-plugin
